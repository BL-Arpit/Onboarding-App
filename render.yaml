services:
  - type: web
    name: onboarding-demo-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    plan: free
    envVars:
      - key: DATA_DIR
        value: /tmp/onboarding-data
      - key: STORE_FULL_AADHAAR
        value: "false"
      - key: MAX_UPLOAD_MB
        value: "10"
      - key: CORS_ORIGINS
        sync: false
